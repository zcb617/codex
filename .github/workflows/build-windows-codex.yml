name: Build Windows and Linux Codex CLI

on:
  workflow_dispatch:
  push:
    branches:
      - dev/from-rust-v0.144.6

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build codex (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: windows-codex-cli

      - name: Build Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo build --release --target x86_64-pc-windows-msvc \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-windows-sandbox-setup \
            --bin codex-command-runner

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/x86_64-pc-windows-msvc/release"
          # Sibling layout: CLI resolves helpers next to current_exe.
          mkdir -p dist
          for name in \
            codex.exe \
            codex-code-mode-host.exe \
            codex-windows-sandbox-setup.exe \
            codex-command-runner.exe
          do
            cp "${release_dir}/${name}" "dist/${name}"
          done
          ls -lh dist/

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-pc-windows-msvc
          path: |
            codex-rs/dist/codex.exe
            codex-rs/dist/codex-code-mode-host.exe
            codex-rs/dist/codex-windows-sandbox-setup.exe
            codex-rs/dist/codex-command-runner.exe
          if-no-files-found: error
          retention-days: 14

  build-linux-x64:
    name: Build codex (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: linux-codex-cli

      - name: Build Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin codex

      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-unknown-linux-gnu
          path: codex-rs/target/release/codex
          if-no-files-found: error
          retention-days: 14
