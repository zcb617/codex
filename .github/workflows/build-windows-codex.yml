# Multi-platform CLI build + GitHub Release for this fork.
#
# Upstream rust-release.yml (and related publishers) are removed on this fork.
# Push the rust-v* tag; this workflow builds that commit and attaches archives
# to the GitHub Release for the same tag:
#   git tag rust-v0.149.1
#   git push origin rust-v0.149.1
#
# workflow_dispatch still builds artifacts only; it does not create a Release.
name: Build Windows Linux and macOS Codex CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "rust-v*.*.*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build codex (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: windows-codex-cli

      # v8 0.150+ prebuilts are published on openai/codex rusty-v8 releases,
      # not denoland/rusty_v8 (default crate download 404s in CI).
      - name: Configure rusty_v8 artifacts
        id: rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      # rust-cache prunes the profile-level gn_out directory where v8 stores
      # the prebuilt native library, so cache that output separately.
      - name: Restore rusty_v8 native library
        id: restore_rusty_v8
        uses: actions/cache/restore@v4
        with:
          path: codex-rs/target/x86_64-pc-windows-msvc/release/gn_out/obj/rusty_v8.lib
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-x86_64-pc-windows-msvc-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Re-arm rusty_v8 build on cache miss
        if: steps.restore_rusty_v8.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rebound_dir="${RUNNER_TEMP}/rusty_v8/${GITHUB_RUN_ID}"
          mkdir -p "${rebound_dir}"
          archive_path="${rebound_dir}/$(basename "${RUSTY_V8_ARCHIVE}")"
          binding_path="${rebound_dir}/$(basename "${RUSTY_V8_SRC_BINDING_PATH}")"
          cp "${RUSTY_V8_ARCHIVE}" "${archive_path}"
          cp "${RUSTY_V8_SRC_BINDING_PATH}" "${binding_path}"
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - name: Build Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo build --release --target x86_64-pc-windows-msvc \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-windows-sandbox-setup \
            --bin codex-command-runner

      - name: Save rusty_v8 native library
        if: success() && steps.restore_rusty_v8.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codex-rs/target/x86_64-pc-windows-msvc/release/gn_out/obj/rusty_v8.lib
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-x86_64-pc-windows-msvc-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/x86_64-pc-windows-msvc/release"
          pkg="dist/package"
          rm -rf "${pkg}"
          mkdir -p "${pkg}/bin" "${pkg}/codex-path" "${pkg}/codex-resources"
          cp "${release_dir}/codex.exe" "${pkg}/bin/codex.exe"
          cp "${release_dir}/codex-code-mode-host.exe" "${pkg}/bin/codex-code-mode-host.exe"
          cp "${release_dir}/codex-windows-sandbox-setup.exe" "${pkg}/codex-resources/codex-windows-sandbox-setup.exe"
          cp "${release_dir}/codex-command-runner.exe" "${pkg}/codex-resources/codex-command-runner.exe"
          curl -fsSL -o "${RUNNER_TEMP}/rg.zip" \
            https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip
          rm -rf "${RUNNER_TEMP}/rg"
          mkdir -p "${RUNNER_TEMP}/rg"
          tar -xf "${RUNNER_TEMP}/rg.zip" -C "${RUNNER_TEMP}/rg"
          cp "${RUNNER_TEMP}/rg/ripgrep-15.2.0-x86_64-pc-windows-msvc/rg.exe" "${pkg}/codex-path/rg.exe"
          version="$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          CODEX_PACKAGE_VERSION="${version}" python -c 'import json,os,pathlib; pathlib.Path("dist/package/codex-package.json").write_text(json.dumps({"layoutVersion":1,"version":os.environ["CODEX_PACKAGE_VERSION"],"target":"x86_64-pc-windows-msvc","variant":"codex","entrypoint":"bin/codex.exe","resourcesDir":"codex-resources","pathDir":"codex-path"}, indent=2)+"\n", encoding="utf-8")'
          find "${pkg}" -type f -print

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-pc-windows-msvc
          path: codex-rs/dist/package
          if-no-files-found: error
          retention-days: 14

  build-linux-x64:
    name: Build codex (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: linux-codex-cli

      - name: Configure rusty_v8 artifacts
        id: rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      # rust-cache prunes the profile-level gn_out directory where v8 stores
      # the prebuilt native library, so cache that output separately.
      - name: Restore rusty_v8 native library
        id: restore_rusty_v8
        uses: actions/cache/restore@v4
        with:
          path: codex-rs/target/x86_64-unknown-linux-gnu/release/gn_out/obj/librusty_v8.a
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-x86_64-unknown-linux-gnu-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Re-arm rusty_v8 build on cache miss
        if: steps.restore_rusty_v8.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rebound_dir="${RUNNER_TEMP}/rusty_v8/${GITHUB_RUN_ID}"
          mkdir -p "${rebound_dir}"
          archive_path="${rebound_dir}/$(basename "${RUSTY_V8_ARCHIVE}")"
          binding_path="${rebound_dir}/$(basename "${RUSTY_V8_SRC_BINDING_PATH}")"
          cp "${RUSTY_V8_ARCHIVE}" "${archive_path}"
          cp "${RUSTY_V8_SRC_BINDING_PATH}" "${binding_path}"
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - name: Build Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-unknown-linux-gnu \
            --bin codex \
            --bin codex-code-mode-host \
            --bin bwrap

      - name: Save rusty_v8 native library
        if: success() && steps.restore_rusty_v8.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codex-rs/target/x86_64-unknown-linux-gnu/release/gn_out/obj/librusty_v8.a
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-x86_64-unknown-linux-gnu-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Stage Linux package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/x86_64-unknown-linux-gnu/release"
          pkg="dist/package"
          rm -rf "${pkg}"
          mkdir -p "${pkg}/bin" "${pkg}/codex-path" "${pkg}/codex-resources"
          cp "${release_dir}/codex" "${pkg}/bin/codex"
          cp "${release_dir}/codex-code-mode-host" "${pkg}/bin/codex-code-mode-host"
          cp "${release_dir}/bwrap" "${pkg}/codex-resources/bwrap"
          curl -fsSL -o "${RUNNER_TEMP}/rg.tar.gz" \
            https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf "${RUNNER_TEMP}/rg.tar.gz" -C "${RUNNER_TEMP}"
          cp "${RUNNER_TEMP}/ripgrep-15.2.0-x86_64-unknown-linux-musl/rg" "${pkg}/codex-path/rg"
          chmod +x "${pkg}/bin/codex" "${pkg}/bin/codex-code-mode-host" "${pkg}/codex-path/rg" "${pkg}/codex-resources/bwrap"
          version="$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          CODEX_PACKAGE_VERSION="${version}" python3 -c 'import json,os,pathlib; pathlib.Path("dist/package/codex-package.json").write_text(json.dumps({"layoutVersion":1,"version":os.environ["CODEX_PACKAGE_VERSION"],"target":"x86_64-unknown-linux-gnu","variant":"codex","entrypoint":"bin/codex","resourcesDir":"codex-resources","pathDir":"codex-path"}, indent=2)+"\n", encoding="utf-8")'
          find "${pkg}" -type f -print

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-unknown-linux-gnu
          path: codex-rs/dist/package
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build codex (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: codex-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            artifact_name: codex-x86_64-apple-darwin
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: macos-codex-cli-${{ matrix.target }}

      - name: Configure rusty_v8 artifacts
        id: rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      # rust-cache prunes the profile-level gn_out directory where v8 stores
      # the prebuilt native library, so cache that output separately.
      - name: Restore rusty_v8 native library
        id: restore_rusty_v8
        uses: actions/cache/restore@v4
        with:
          path: codex-rs/target/${{ matrix.target }}/release/gn_out/obj/librusty_v8.a
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-${{ matrix.target }}-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Re-arm rusty_v8 build on cache miss
        if: steps.restore_rusty_v8.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rebound_dir="${RUNNER_TEMP}/rusty_v8/${GITHUB_RUN_ID}"
          mkdir -p "${rebound_dir}"
          archive_path="${rebound_dir}/$(basename "${RUSTY_V8_ARCHIVE}")"
          binding_path="${rebound_dir}/$(basename "${RUSTY_V8_SRC_BINDING_PATH}")"
          cp "${RUSTY_V8_ARCHIVE}" "${archive_path}"
          cp "${RUSTY_V8_SRC_BINDING_PATH}" "${binding_path}"
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - name: Build macOS CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}" \
            --bin codex \
            --bin codex-code-mode-host

      - name: Save rusty_v8 native library
        if: success() && steps.restore_rusty_v8.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codex-rs/target/${{ matrix.target }}/release/gn_out/obj/librusty_v8.a
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-${{ matrix.target }}-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Stage macOS package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release_dir="target/${TARGET}/release"
          pkg="dist/package"
          rm -rf "${pkg}"
          mkdir -p "${pkg}/bin" "${pkg}/codex-path" "${pkg}/codex-resources"
          cp "${release_dir}/codex" "${pkg}/bin/codex"
          cp "${release_dir}/codex-code-mode-host" "${pkg}/bin/codex-code-mode-host"
          case "${TARGET}" in
            aarch64-apple-darwin)
              rg_archive="ripgrep-15.2.0-aarch64-apple-darwin.tar.gz"
              rg_dir="ripgrep-15.2.0-aarch64-apple-darwin"
              ;;
            x86_64-apple-darwin)
              rg_archive="ripgrep-15.2.0-x86_64-apple-darwin.tar.gz"
              rg_dir="ripgrep-15.2.0-x86_64-apple-darwin"
              ;;
            *)
              echo "unsupported macOS target ${TARGET}" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "${RUNNER_TEMP}/rg.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/${rg_archive}"
          tar -xzf "${RUNNER_TEMP}/rg.tar.gz" -C "${RUNNER_TEMP}"
          cp "${RUNNER_TEMP}/${rg_dir}/rg" "${pkg}/codex-path/rg"
          chmod +x "${pkg}/bin/codex" "${pkg}/bin/codex-code-mode-host" "${pkg}/codex-path/rg"
          version="$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          CODEX_PACKAGE_VERSION="${version}" CODEX_PACKAGE_TARGET="${TARGET}" python3 -c 'import json,os,pathlib; pathlib.Path("dist/package/codex-package.json").write_text(json.dumps({"layoutVersion":1,"version":os.environ["CODEX_PACKAGE_VERSION"],"target":os.environ["CODEX_PACKAGE_TARGET"],"variant":"codex","entrypoint":"bin/codex","resourcesDir":"codex-resources","pathDir":"codex-path"}, indent=2)+"\n", encoding="utf-8")'
          find "${pkg}" -type f -print

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: codex-rs/dist/package
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - build-windows-x64
      - build-linux-x64
      - build-macos
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          # Tag names contain slashes; flatten for archive filenames.
          asset_tag="${tag//\//-}"
          mkdir -p release-assets

          package_dir() {
            local artifact_name="$1"
            local found
            found="$(find "artifacts/${artifact_name}" -type f -name codex-package.json -print | head -n 1)"
            if [[ -z "${found}" ]]; then
              echo "could not find codex-package.json in artifacts/${artifact_name}" >&2
              find "artifacts/${artifact_name}" -print >&2 || true
              exit 1
            fi
            dirname "${found}"
          }

          require_files() {
            local dir="$1"
            shift
            local name
            for name in "$@"; do
              if [[ ! -f "${dir}/${name}" ]]; then
                echo "missing ${dir}/${name}" >&2
                find artifacts -type f -print >&2
                exit 1
              fi
            done
          }

          pack_unix() {
            local dir="$1"
            local archive="$2"
            shift 2
            chmod +x "$@"
            tar -C "${dir}" -czf "${archive}" \
              codex-package.json \
              bin \
              codex-path \
              codex-resources
          }

          win_dir="$(package_dir codex-x86_64-pc-windows-msvc)"
          require_files "${win_dir}" \
            codex-package.json \
            bin/codex.exe \
            bin/codex-code-mode-host.exe \
            codex-path/rg.exe \
            codex-resources/codex-windows-sandbox-setup.exe \
            codex-resources/codex-command-runner.exe
          (
            cd "${win_dir}"
            zip -r "${GITHUB_WORKSPACE}/release-assets/codex-${asset_tag}-x86_64-pc-windows-msvc.zip" \
              codex-package.json \
              bin \
              codex-path \
              codex-resources
          )

          linux_dir="$(package_dir codex-x86_64-unknown-linux-gnu)"
          require_files "${linux_dir}" \
            codex-package.json \
            bin/codex \
            bin/codex-code-mode-host \
            codex-path/rg \
            codex-resources/bwrap
          pack_unix "${linux_dir}" \
            "release-assets/codex-${asset_tag}-x86_64-unknown-linux-gnu.tar.gz" \
            "${linux_dir}/bin/codex" \
            "${linux_dir}/bin/codex-code-mode-host" \
            "${linux_dir}/codex-path/rg" \
            "${linux_dir}/codex-resources/bwrap"

          macos_arm_dir="$(package_dir codex-aarch64-apple-darwin)"
          require_files "${macos_arm_dir}" \
            codex-package.json \
            bin/codex \
            bin/codex-code-mode-host \
            codex-path/rg
          pack_unix "${macos_arm_dir}" \
            "release-assets/codex-${asset_tag}-aarch64-apple-darwin.tar.gz" \
            "${macos_arm_dir}/bin/codex" \
            "${macos_arm_dir}/bin/codex-code-mode-host" \
            "${macos_arm_dir}/codex-path/rg"

          macos_x64_dir="$(package_dir codex-x86_64-apple-darwin)"
          require_files "${macos_x64_dir}" \
            codex-package.json \
            bin/codex \
            bin/codex-code-mode-host \
            codex-path/rg
          pack_unix "${macos_x64_dir}" \
            "release-assets/codex-${asset_tag}-x86_64-apple-darwin.tar.gz" \
            "${macos_x64_dir}/bin/codex" \
            "${macos_x64_dir}/bin/codex-code-mode-host" \
            "${macos_x64_dir}/codex-path/rg"

          ls -lh release-assets/

          repo="${GITHUB_REPOSITORY}"
          if gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber --repo "${repo}"
          else
            gh release create "${tag}" \
              --repo "${repo}" \
              --title "Codex CLI ${tag}" \
              --generate-notes \
              release-assets/*
          fi
