name: Build Windows codex.exe

on:
  workflow_dispatch:
  push:
    branches:
      - dev/from-rust-v0.144.5

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build codex (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: windows-codex-cli

      - name: Build Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo build --release --target x86_64-pc-windows-msvc \
            --bin codex \
            --bin codex-code-mode-host

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/x86_64-pc-windows-msvc/release"
          mkdir -p dist
          cp "${release_dir}/codex.exe" dist/codex.exe
          cp "${release_dir}/codex-code-mode-host.exe" dist/codex-code-mode-host.exe
          ls -lh dist/

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-pc-windows-msvc
          path: |
            codex-rs/dist/codex.exe
            codex-rs/dist/codex-code-mode-host.exe
          if-no-files-found: error
          retention-days: 14
