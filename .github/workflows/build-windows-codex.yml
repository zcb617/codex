# Multi-platform CLI build + GitHub Release for this fork.
#
# Upstream rust-release.yml (and related publishers) are removed on this fork.
# Push the rust-v* tag; this workflow builds that commit and attaches archives
# to the GitHub Release for the same tag:
#   git tag rust-v0.149.1
#   git push origin rust-v0.149.1
#
# workflow_dispatch still builds artifacts only; it does not create a Release.
name: Build Windows Linux and macOS Codex CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "rust-v*.*.*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build codex (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: windows-codex-cli

      # v8 0.150+ prebuilts are published on openai/codex rusty-v8 releases,
      # not denoland/rusty_v8 (default crate download 404s in CI).
      - name: Configure rusty_v8 artifacts
        id: rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      # rust-cache prunes the profile-level gn_out directory where v8 stores
      # the prebuilt native library, so cache that output separately.
      - name: Restore rusty_v8 native library
        id: restore_rusty_v8
        uses: actions/cache/restore@v4
        with:
          path: codex-rs/target/x86_64-pc-windows-msvc/release/gn_out/obj/rusty_v8.lib
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-x86_64-pc-windows-msvc-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Re-arm rusty_v8 build on cache miss
        if: steps.restore_rusty_v8.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rebound_dir="${RUNNER_TEMP}/rusty_v8/${GITHUB_RUN_ID}"
          mkdir -p "${rebound_dir}"
          archive_path="${rebound_dir}/$(basename "${RUSTY_V8_ARCHIVE}")"
          binding_path="${rebound_dir}/$(basename "${RUSTY_V8_SRC_BINDING_PATH}")"
          cp "${RUSTY_V8_ARCHIVE}" "${archive_path}"
          cp "${RUSTY_V8_SRC_BINDING_PATH}" "${binding_path}"
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - name: Build Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo build --release --target x86_64-pc-windows-msvc \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-windows-sandbox-setup \
            --bin codex-command-runner

      - name: Save rusty_v8 native library
        if: success() && steps.restore_rusty_v8.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codex-rs/target/x86_64-pc-windows-msvc/release/gn_out/obj/rusty_v8.lib
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-x86_64-pc-windows-msvc-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/x86_64-pc-windows-msvc/release"
          # Sibling layout: CLI resolves helpers next to current_exe.
          mkdir -p dist
          for name in \
            codex.exe \
            codex-code-mode-host.exe \
            codex-windows-sandbox-setup.exe \
            codex-command-runner.exe
          do
            cp "${release_dir}/${name}" "dist/${name}"
          done
          ls -lh dist/

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-pc-windows-msvc
          path: |
            codex-rs/dist/codex.exe
            codex-rs/dist/codex-code-mode-host.exe
            codex-rs/dist/codex-windows-sandbox-setup.exe
            codex-rs/dist/codex-command-runner.exe
          if-no-files-found: error
          retention-days: 14

  build-linux-x64:
    name: Build codex (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: linux-codex-cli

      - name: Configure rusty_v8 artifacts
        id: rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      # rust-cache prunes the profile-level gn_out directory where v8 stores
      # the prebuilt native library, so cache that output separately.
      - name: Restore rusty_v8 native library
        id: restore_rusty_v8
        uses: actions/cache/restore@v4
        with:
          path: codex-rs/target/x86_64-unknown-linux-gnu/release/gn_out/obj/librusty_v8.a
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-x86_64-unknown-linux-gnu-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Re-arm rusty_v8 build on cache miss
        if: steps.restore_rusty_v8.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rebound_dir="${RUNNER_TEMP}/rusty_v8/${GITHUB_RUN_ID}"
          mkdir -p "${rebound_dir}"
          archive_path="${rebound_dir}/$(basename "${RUSTY_V8_ARCHIVE}")"
          binding_path="${rebound_dir}/$(basename "${RUSTY_V8_SRC_BINDING_PATH}")"
          cp "${RUSTY_V8_ARCHIVE}" "${archive_path}"
          cp "${RUSTY_V8_SRC_BINDING_PATH}" "${binding_path}"
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - name: Build Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-unknown-linux-gnu \
            --bin codex \
            --bin codex-code-mode-host

      - name: Save rusty_v8 native library
        if: success() && steps.restore_rusty_v8.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codex-rs/target/x86_64-unknown-linux-gnu/release/gn_out/obj/librusty_v8.a
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-x86_64-unknown-linux-gnu-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Stage Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/x86_64-unknown-linux-gnu/release"
          mkdir -p dist
          for name in codex codex-code-mode-host; do
            cp "${release_dir}/${name}" "dist/${name}"
          done
          ls -lh dist/

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-unknown-linux-gnu
          path: |
            codex-rs/dist/codex
            codex-rs/dist/codex-code-mode-host
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build codex (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: codex-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            artifact_name: codex-x86_64-apple-darwin
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: macos-codex-cli-${{ matrix.target }}

      - name: Configure rusty_v8 artifacts
        id: rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      # rust-cache prunes the profile-level gn_out directory where v8 stores
      # the prebuilt native library, so cache that output separately.
      - name: Restore rusty_v8 native library
        id: restore_rusty_v8
        uses: actions/cache/restore@v4
        with:
          path: codex-rs/target/${{ matrix.target }}/release/gn_out/obj/librusty_v8.a
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-${{ matrix.target }}-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Re-arm rusty_v8 build on cache miss
        if: steps.restore_rusty_v8.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rebound_dir="${RUNNER_TEMP}/rusty_v8/${GITHUB_RUN_ID}"
          mkdir -p "${rebound_dir}"
          archive_path="${rebound_dir}/$(basename "${RUSTY_V8_ARCHIVE}")"
          binding_path="${rebound_dir}/$(basename "${RUSTY_V8_SRC_BINDING_PATH}")"
          cp "${RUSTY_V8_ARCHIVE}" "${archive_path}"
          cp "${RUSTY_V8_SRC_BINDING_PATH}" "${binding_path}"
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - name: Build macOS CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}" \
            --bin codex \
            --bin codex-code-mode-host

      - name: Save rusty_v8 native library
        if: success() && steps.restore_rusty_v8.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codex-rs/target/${{ matrix.target }}/release/gn_out/obj/librusty_v8.a
          key: rusty-v8-${{ steps.rusty_v8.outputs.version }}-${{ matrix.target }}-${{ steps.rusty_v8.outputs.artifact_key }}

      - name: Stage macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          for name in codex codex-code-mode-host; do
            cp "${release_dir}/${name}" "dist/${name}"
          done
          ls -lh dist/

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            codex-rs/dist/codex
            codex-rs/dist/codex-code-mode-host
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - build-windows-x64
      - build-linux-x64
      - build-macos
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          # Tag names contain slashes; flatten for archive filenames.
          asset_tag="${tag//\//-}"
          mkdir -p release-assets

          artifact_dir() {
            local artifact_name="$1"
            local probe="$2"
            local found
            found="$(find "artifacts/${artifact_name}" -type f -name "${probe}" -print | head -n 1)"
            if [[ -z "${found}" ]]; then
              echo "could not find ${probe} in artifacts/${artifact_name}" >&2
              find "artifacts/${artifact_name}" -print >&2 || true
              exit 1
            fi
            dirname "${found}"
          }

          require_files() {
            local dir="$1"
            shift
            local name
            for name in "$@"; do
              if [[ ! -f "${dir}/${name}" ]]; then
                echo "missing ${dir}/${name}" >&2
                find artifacts -type f -print >&2
                exit 1
              fi
            done
          }

          win_dir="$(artifact_dir codex-x86_64-pc-windows-msvc codex.exe)"
          require_files "${win_dir}" \
            codex.exe \
            codex-code-mode-host.exe \
            codex-windows-sandbox-setup.exe \
            codex-command-runner.exe
          (
            cd "${win_dir}"
            zip "${GITHUB_WORKSPACE}/release-assets/codex-${asset_tag}-x86_64-pc-windows-msvc.zip" \
              codex.exe \
              codex-code-mode-host.exe \
              codex-windows-sandbox-setup.exe \
              codex-command-runner.exe
          )

          linux_dir="$(artifact_dir codex-x86_64-unknown-linux-gnu codex)"
          require_files "${linux_dir}" codex codex-code-mode-host
          tar -C "${linux_dir}" -czf \
            "release-assets/codex-${asset_tag}-x86_64-unknown-linux-gnu.tar.gz" \
            codex \
            codex-code-mode-host

          macos_arm_dir="$(artifact_dir codex-aarch64-apple-darwin codex)"
          require_files "${macos_arm_dir}" codex codex-code-mode-host
          tar -C "${macos_arm_dir}" -czf \
            "release-assets/codex-${asset_tag}-aarch64-apple-darwin.tar.gz" \
            codex \
            codex-code-mode-host

          macos_x64_dir="$(artifact_dir codex-x86_64-apple-darwin codex)"
          require_files "${macos_x64_dir}" codex codex-code-mode-host
          tar -C "${macos_x64_dir}" -czf \
            "release-assets/codex-${asset_tag}-x86_64-apple-darwin.tar.gz" \
            codex \
            codex-code-mode-host

          ls -lh release-assets/

          repo="${GITHUB_REPOSITORY}"
          if gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber --repo "${repo}"
          else
            gh release create "${tag}" \
              --repo "${repo}" \
              --title "Codex CLI ${tag}" \
              --generate-notes \
              release-assets/*
          fi
