name: Build Windows codex.exe

on:
  workflow_dispatch:
  push:
    branches:
      - dev/from-rust-v0.144.4

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build codex (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: windows-codex-cli

      - name: Build codex.exe
        shell: bash
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo build --release --target x86_64-pc-windows-msvc --bin codex

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/codex.exe" dist/codex.exe
          ls -lh dist/codex.exe

      - name: Upload codex.exe
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-pc-windows-msvc
          path: codex-rs/dist/codex.exe
          if-no-files-found: error
          retention-days: 14
